name: Agentic QA PBI Validation

run-name: QA validation for PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  qa-validation:

    # Only QA branches created by your platform
    if: startsWith(github.head_ref, 'qa/')

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ======================================================
      # CHECKOUT EXACT PR COMMIT
      # ======================================================

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0


      # ======================================================
      # SHOW EXECUTION CONTEXT
      # ======================================================

      - name: Display QA execution context
        shell: bash
        run: |
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "QA Branch: ${{ github.head_ref }}"
          echo "Base Branch: ${{ github.base_ref }}"
          echo "Commit SHA: ${{ github.event.pull_request.head.sha }}"


      # ======================================================
      # DISCOVER TEST FILES CHANGED BY THIS PBI PR
      # ======================================================

      - name: Find changed automated tests
        id: changed_tests
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}"

          mapfile -t CHANGED_FILES < <(
            git diff \
              --name-only \
              --diff-filter=AM \
              "origin/${{ github.base_ref }}...HEAD"
          )

          echo "Files changed in this PR:"

          printf '%s\n' "${CHANGED_FILES[@]}"

          TEST_FILES=()

          for file in "${CHANGED_FILES[@]}"; do

            case "$file" in

              tests/*.spec.js|\
              tests/*.test.js|\
              e2e/*.spec.js|\
              e2e/*.test.js)

                TEST_FILES+=("$file")
                ;;

            esac

          done


          if [ "${#TEST_FILES[@]}" -eq 0 ]; then

            echo "No PBI-related Playwright tests were found."

            exit 1

          fi


          echo ""
          echo "Tests selected for this PBI:"

          printf '%s\n' "${TEST_FILES[@]}"


          # Store safely as newline-delimited output.

          {
            echo "files<<EOF"
            printf '%s\n' "${TEST_FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      # ======================================================
      # NODE SETUP
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm


      # ======================================================
      # INSTALL PROJECT
      # ======================================================

      - name: Install dependencies
        run: npm ci


      # ======================================================
      # PLAYWRIGHT
      # ======================================================

      - name: Install Playwright browsers
        run: npx playwright install --with-deps


      # ======================================================
      # EXECUTE ONLY PBI-RELATED TESTS
      # ======================================================

      - name: Execute PBI-related Playwright tests
        shell: bash
        env:
          CHANGED_TESTS: ${{ steps.changed_tests.outputs.files }}

        run: |
          mapfile -t TEST_FILES <<< "$CHANGED_TESTS"

          echo "Executing only these tests:"

          printf '%s\n' "${TEST_FILES[@]}"

          npx playwright test "${TEST_FILES[@]}"


      # ======================================================
      # EVIDENCE
      # ======================================================

      - name: Upload Playwright report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}

          path: playwright-report/

          if-no-files-found: ignore


      - name: Upload Playwright test results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: test-results-pr-${{ github.event.pull_request.number }}

          path: test-results/

          if-no-files-found: ignore
