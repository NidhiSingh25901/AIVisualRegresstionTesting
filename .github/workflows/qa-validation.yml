name: Agentic QA PBI Validation

run-name: Agentic QA validation - PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened


permissions:
  contents: read


jobs:

  qa-validation:

    # --------------------------------------------------------
    # Only run automatically for branches created
    # by the Agentic QA platform.
    # --------------------------------------------------------

    if: startsWith(github.head_ref, 'qa/')

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      # ======================================================
      # CHECKOUT EXACT PR COMMIT
      # ======================================================

      - name: Checkout PR commit
        uses: actions/checkout@v4

        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0


      # ======================================================
      # DISPLAY CONTEXT
      # ======================================================

      - name: Display execution context

        shell: bash

        run: |

          echo "======================================"
          echo "Agentic QA PBI Validation"
          echo "======================================"

          echo "PR Number:"
          echo "${{ github.event.pull_request.number }}"

          echo "QA Branch:"
          echo "${{ github.head_ref }}"

          echo "Base Branch:"
          echo "${{ github.base_ref }}"

          echo "Commit SHA:"
          echo "${{ github.event.pull_request.head.sha }}"


      # ======================================================
      # FIND FILES CHANGED BY THIS PR
      # ======================================================

      - name: Detect changed files

        id: changed_tests

        shell: bash

        run: |

          echo "Fetching base branch..."

          git fetch origin "${{ github.base_ref }}"


          echo ""
          echo "Files changed by this PR:"
          echo "--------------------------------------"


          mapfile -t CHANGED_FILES < <(
            git diff \
              --name-only \
              --diff-filter=AM \
              "origin/${{ github.base_ref }}...HEAD"
          )


          printf '%s\n' "${CHANGED_FILES[@]}"


          # ==================================================
          # SELECT ONLY AUTOMATION TEST FILES
          # ==================================================

          TEST_FILES=()


          for file in "${CHANGED_FILES[@]}"; do

            case "$file" in

              tests/*.spec.js|\
              tests/*.test.js|\
              e2e/*.spec.js|\
              e2e/*.test.js|\
              specs/*.spec.js|\
              specs/*.test.js)

                TEST_FILES+=("$file")

                ;;

            esac

          done


          echo ""
          echo "======================================"
          echo "PBI-related automation files"
          echo "======================================"


          if [ "${#TEST_FILES[@]}" -eq 0 ]; then

            echo "No Playwright test files were changed."

            echo ""
            echo "The PR does not contain an executable"
            echo "PBI-related Playwright test."

            exit 1

          fi


          printf '%s\n' "${TEST_FILES[@]}"


          # ==================================================
          # PASS TEST LIST TO NEXT STEP
          # ==================================================

          {
            echo "files<<EOF"

            printf '%s\n' "${TEST_FILES[@]}"

            echo "EOF"

          } >> "$GITHUB_OUTPUT"


      # ======================================================
      # NODE
      # ======================================================

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:
          node-version: "20"
          cache: npm


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: npm ci


      # ======================================================
      # PLAYWRIGHT BROWSERS
      # ======================================================

      - name: Install Playwright browsers

        run: |

          npx playwright install --with-deps


      # ======================================================
      # EXECUTE ONLY TESTS CHANGED BY THE PBI PR
      # ======================================================

      - name: Execute PBI-related Playwright tests

        shell: bash

        env:
          CHANGED_TESTS: ${{ steps.changed_tests.outputs.files }}

        run: |

          echo "======================================"
          echo "Tests selected for execution"
          echo "======================================"


          mapfile -t TEST_FILES <<< "$CHANGED_TESTS"


          printf '%s\n' "${TEST_FILES[@]}"


          echo ""
          echo "Starting Playwright..."


          npx playwright test "${TEST_FILES[@]}"


      # ======================================================
      # PLAYWRIGHT REPORT
      # ======================================================

      - name: Upload Playwright report

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: playwright-report-pr-${{ github.event.pull_request.number }}

          path: playwright-report/

          if-no-files-found: ignore

          retention-days: 7


      # ======================================================
      # TEST RESULTS / SCREENSHOTS / TRACES
      # ======================================================

      - name: Upload Playwright test results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: test-results-pr-${{ github.event.pull_request.number }}

          path: test-results/

          if-no-files-found: ignore

          retention-days: 7
